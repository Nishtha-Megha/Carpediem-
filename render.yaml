services:
  - type: web
    name: carpediem-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn carpedium.wsgi:application
    healthCheckPath: /api/events
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: ALLOWED_HOSTS
        value: carpediem-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://carpediem-web.onrender.com

  - type: web
    name: carpediem-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://carpediem-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html